<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Flower Garden ✨🌸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Efek Kunang-kunang Latar -->
    <div id="kunang-container"></div>

    <!-- Lirik Melayang / Pesan Utama -->
    <div id="lirik-box"></div>

    <!-- Kanvas Utama Tempat Bunga & Kupu-kupu Muncul Nanti -->
    <main id="taman"></main>

    <!-- KOTAK TANTANGAN / TEKA-TEKI AWAL -->
    <div id="layar-tantangan" class="overlay">
        <div class="kartu">
            <h1>✨ Kunci Taman Magis ✨</h1>
            <p>Selesaikan teka-teki lirik ini untuk membuka taman dan membangunkan bunga-bunga:</p>
            <p class="soal-lirik">"That I should have bought you ______"</p>
            
            <div class="pilihan-btn">
                <button class="btn-pilihan" data-jawaban="salah">Stars ✨</button>
                <button class="btn-pilihan" data-jawaban="benar">Flowers 🌸</button>
                <button class="btn-pilihan" data-jawaban="salah">Shadows 🌙</button>
            </div>
            <p id="pesan-salah" class="pesan-salah tersembunyi">Ups, bukan itu! Coba ingat lirik lagunya lagi... 🎶</p>
        </div>
    </div>

    <!-- LAYAR ENDING / KETERANGAN SETELAH TAMAN TERBUKA -->
    <div id="layar-ending" class="overlay tersembunyi">
        <div class="kartu ending-card">
            <h1>Taman Impian Terwujud! 🌸🦋</h1>
            <p>"That I should have bought you flowers, and held your hand..."</p>
            <button id="btn-ulang">Main Lagi 🔄</button>
        </div>
    </div>

    <!-- Audio Lagu -->
    <audio id="lagu" src="lagu.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
