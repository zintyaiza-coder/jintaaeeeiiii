<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Flower Garden ✨🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Efek Bintang/Kunang-kunang Latar -->
    <div id="kunang-container"></div>

    <!-- Kotak Lirik Berjalan Ala Video -->
    <div id="lirik-video-box" class="tersembunyi">
        <h2 id="teks-lirik-utama"></h2>
    </div>

    <!-- Kanvas Utama Tempat Bunga & Kupu-kupu Muncul -->
    <main id="taman"></main>

    <!-- KOTAK TANTANGAN / TEKA-TEKI AWAL -->
    <div id="layar-tantangan" class="overlay">
        <div class="kartu">
            <div class="ikon-mahkota">🌸✨</div>
            <h1>Kunci Taman Magis</h1>
            <p>Selesaikan teka-teki lirik ini untuk membuka taman:</p>
            <p class="soal-lirik">"That I should have bought you ______"</p>
            
            <div class="pilihan-btn">
                <button class="btn-pilihan" data-jawaban="salah">Stars ✨</button>
                <button class="btn-pilihan" data-jawaban="benar">Flowers 🌸</button>
                <button class="btn-pilihan" data-jawaban="salah">Shadows 🌙</button>
            </div>
            <p id="pesan-salah" class="pesan-salah tersembunyi">Ups, bukan itu! Coba ingat lirik lagunya lagi... 🎶</p>
        </div>
    </div>

    <!-- Tombol Ulangi di Pojok Kanan Atas -->
    <button id="btn-ulang" class="btn-ulang tersembunyi">Ulangi 🔄</button>

    <!-- Audio Lagu -->
    <audio id="lagu" src="lagu.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
