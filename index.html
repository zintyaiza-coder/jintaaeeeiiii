<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Glowing Garden ✨🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Playfair+Display:ital,wght@0,500;1,600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Kanvas Partikel Cahaya & Kunang-kunang Real-time -->
    <canvas id="canvas-partikel"></canvas>

    <!-- Kabut Cahaya Latar -->
    <div class="aurora-bg"></div>

    <!-- Lirik Sinematik -->
    <div id="lirik-container" class="tersembunyi">
        <p id="teks-lirik"></p>
    </div>

    <!-- Wadah Taman Bunga 3D CSS -->
    <div id="taman-bunga"></div>

    <!-- Rumput Bercahaya di Bagian Bawah -->
    <div id="rumput-container"></div>

    <!-- LAYAR TEKA-TEKI AWAL -->
    <div id="layar-tantangan" class="overlay">
        <div class="kartu">
            <div class="badge">✨ SECRET GARDEN ✨</div>
            <h1>Kunci Taman Cahaya</h1>
            <p class="deskripsi">Lengkapi potongan lirik ini untuk membangunkan bunga-bunga di kegelapan:</p>
            <div class="kotak-soal">
                "That I should have bought you <span class="kosong">______</span>"
            </div>
            
            <div class="pilihan-btn">
                <button class="btn-pilihan" data-jawaban="salah">Stars ✨</button>
                <button class="btn-pilihan" data-jawaban="benar">Flowers 🌸</button>
                <button class="btn-pilihan" data-jawaban="salah">Shadows 🌙</button>
            </div>
            <p id="pesan-salah" class="pesan-salah tersembunyi">Bukan itu... coba dengarkan lagi melodi di hatimu 🎶</p>
        </div>
    </div>

    <!-- Petunjuk & Tombol Reset -->
    <div id="petunjuk" class="tersembunyi">Sentuh layar untuk memanggil cahaya & bunga baru ✨</div>
    <button id="btn-ulang" class="btn-ulang tersembunyi">Ulangi ↻</button>

    <!-- Audio Lagu -->
    <audio id="lagu" src="lagu.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
