<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Taman Bunga & Kupu-Kupu 🦋🌸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="papan-info">
        <h2>🌸 Taman Ajaib 🌸</h2>
        <p>Klik bola cahaya yang muncul untuk memekarkan bunga!</p>
        <div class="skor-box">
            Bunga Mekar: <span id="skor">0</span> | 🦋 Kupu-kupu: <span id="jumlah-kupu">0</span>
        </div>
    </div>

    <!-- Area tempat bermain -->
    <div id="taman"></div>

    <!-- File lagu (pastikan nama filenya lagu.mp3) -->
    <audio id="musik-game" src="lagu.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
